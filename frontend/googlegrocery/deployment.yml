apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlegrocery-deployment
  labels:
    app: googlegrocery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlegrocery
  template:
    metadata:
      labels:
        app: googlegrocery
    spec:
      containers:
      - name: googlegrocery
        image: 004657932016.dkr.ecr.us-east-1.amazonaws.com/shopping-site-googlegrocery:3a7112f5e1579a378ebab6d29d84b598cf783959
        ports:
        - containerPort: 80

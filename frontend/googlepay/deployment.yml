apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlepay-deployment
  labels:
    app: googlepay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlepay
  template:
    metadata:
      labels:
        app: googlepay
    spec:
      containers:
      - name: googlepay
        image: 004657932016.dkr.ecr.us-east-1.amazonaws.com/shopping-site-googlepay:3a7112f5e1579a378ebab6d29d84b598cf783959
        ports:
        - containerPort: 80

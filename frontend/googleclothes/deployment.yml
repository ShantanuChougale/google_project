apiVersion: apps/v1
kind: Deployment
metadata:
  name: googleclothes-deployment
  labels:
    app: googleclothes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googleclothes
  template:
    metadata:
      labels:
        app: googleclothes
    spec:
      containers:
      - name: googleclothes
        image: 004657932016.dkr.ecr.us-east-1.amazonaws.com/shopping-site-googleclothes:2dfa536a25ccd1db852a54ff70e22fea59687630
        ports:
        - containerPort: 80

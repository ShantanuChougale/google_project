apiVersion: apps/v1
kind: Deployment
metadata:
  name: googleclothes-deployment
  labels:
    app: googleclothes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googleclothes
  template:
    metadata:
      labels:
        app: googleclothes
    spec:
      containers:
      - name: googleclothes
        image: 004657932016.dkr.ecr.us-east-1.amazonaws.com/shopping-site-googleclothes:3a7112f5e1579a378ebab6d29d84b598cf783959
        ports:
        - containerPort: 80

apiVersion: apps/v1
kind: Deployment
metadata:
  name: googleclothes-deployment
  labels:
    app: googleclothes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googleclothes
  template:
    metadata:
      labels:
        app: googleclothes
    spec:
      containers:
      - name: googleclothes
        image: 004657932016.dkr.ecr.us-east-1.amazonaws.com/shopping-site-googleclothes:2f106fde08828b8d906729c7fff58a50a8755938
        ports:
        - containerPort: 80

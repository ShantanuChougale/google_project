apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlemusic-deployment
  labels:
    app: googlemusic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlemusic
  template:
    metadata:
      labels:
        app: googlemusic
    spec:
      containers:
      - name: googlemusic
        image: 004657932016.dkr.ecr.us-east-1.amazonaws.com/shopping-site-googlemusic:3a7112f5e1579a378ebab6d29d84b598cf783959
        ports:
        - containerPort: 80

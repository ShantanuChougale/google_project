apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlemusic-deployment
  labels:
    app: googlemusic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlemusic
  template:
    metadata:
      labels:
        app: googlemusic
    spec:
      containers:
      - name: googlemusic
        image: 004657932016.dkr.ecr.us-east-1.amazonaws.com/shopping-site-googlemusic:2f106fde08828b8d906729c7fff58a50a8755938
        ports:
        - containerPort: 80

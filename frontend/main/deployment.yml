apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-frontend-deployment
  labels:
    app: main-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: main-frontend
  template:
    metadata:
      labels:
        app: main-frontend
    spec:
      containers:
      - name: main-frontend
        image: 004657932016.dkr.ecr.us-east-1.amazonaws.com/shopping-site-main:2dfa536a25ccd1db852a54ff70e22fea59687630
        ports:
        - containerPort: 80


apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend-container
          image: 004657932016.dkr.ecr.us-east-1.amazonaws.com/shopping-site-backend:2f106fde08828b8d906729c7fff58a50a8755938
          ports:
            - containerPort: 5000

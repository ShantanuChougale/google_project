apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend-container
          image: 004657932016.dkr.ecr.us-east-1.amazonaws.com/shopping-site-backend:3a7112f5e1579a378ebab6d29d84b598cf783959
          ports:
            - containerPort: 5000
